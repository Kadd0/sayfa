<!DOCTYPE html>
<!-- SPDX-License-Identifier: GPL-3.0-or-later -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; -webkit-user-select: none;
               -webkit-touch-callout: none; -webkit-tap-highlight-color: rgba(0,0,0,0); }
  #pages { position: absolute; left: 0; top: 0; right: 0; bottom: 0;
           display: -webkit-flex; display: flex; -webkit-justify-content: center; justify-content: center;
           -webkit-align-items: center; align-items: center; }
  .page { position: relative; margin: 0 5px; background: #fff; box-shadow: 0 1px 10px rgba(0,0,0,.22); }
  .page canvas { display: block; }
  .textLayer { position: absolute; left: 0; top: 0; right: 0; bottom: 0; overflow: hidden; line-height: 1; }
  .textLayer > div { color: transparent; position: absolute; white-space: pre; -webkit-transform-origin: 0% 0%; }
  .sy-hl { border-radius: 2px; }
  /* Dark themes: invert page colours (hue turned back so photos keep roughly their colours). */
  body.dark .page { background: #111; box-shadow: none; }
  body.dark .page canvas, body.dark .thumb canvas { -webkit-filter: invert(0.88) hue-rotate(180deg); }
  body.dark .thumb { background: #222 !important; }
</style>
</head>
<body><div id="pages"></div>
<script src="pdf.js"></script>
<script src="pdfview.js"></script>
</body>
</html>
